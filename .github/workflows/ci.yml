name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install wheel tooling
        run: python -m pip install --upgrade build
      - name: Unit and incident tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: Incident tests (explicit package discovery)
        run: python -m unittest discover -s tests/incidents -t tests -v
        env:
          PYTHONPATH: src
      - name: Unit and incident tests (simulated Win32 provider)
        if: runner.os == 'Linux'
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s tests/incidents -t tests -v
        env:
          PYTHONPATH: src
          ORCHESTRATE_BOOTSTRAP_PROVIDER: simulated-win32
      - name: Compile
        run: python -m compileall -q src tests
      - name: Build and isolated install smoke
        shell: bash
        run: |
          python -m build
          python -m venv .venv-smoke
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            .venv-smoke/Scripts/python -m pip install dist/*.whl
            .venv-smoke/Scripts/orchestrate --help
            .venv-smoke/Scripts/orchestrate doctor --help
            .venv-smoke/Scripts/orchestrate-wsl --help
          else
            .venv-smoke/bin/python -m pip install dist/*.whl
            .venv-smoke/bin/orchestrate --help
            .venv-smoke/bin/orchestrate doctor --help
            .venv-smoke/bin/orchestrate-wsl --help
            .venv-smoke/bin/python tests/installed_machine_smoke.py \
              --source-root "$PWD" \
              --command "$PWD/.venv-smoke/bin/orchestrate"
          fi
